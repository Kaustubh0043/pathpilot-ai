version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pathpilot-postgres-db
    ports:
      - "5439:5432"
    environment:
      - POSTGRES_DB=pathpilot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pathpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./pathpilot-ai-service
    container_name: pathpilot-python-ai-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_DB_PATH=/app/chroma_db
      - PORT=8000
    volumes:
      - chroma_data:/app/chroma_db
    restart: always

  backend:
    build: ./pathpilot-backend
    container_name: pathpilot-java-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/pathpilot
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=password
      - AI_SERVICE_URL=http://ai-service:8000
      - FILE_UPLOAD_DIR=/app/uploads
      - JWT_SECRET=40a2f11812848ab221f7db191a27e3681c15f187a51d8b9d363b8d0c3c6f8a8b
      - JWT_EXPIRATION=3600000
      - JWT_REFRESH_EXPIRATION=604800000
    volumes:
      - uploads_data:/app/uploads
    restart: always

  frontend:
    build: ./pathpilot-frontend
    container_name: pathpilot-react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
  uploads_data:
    driver: local
